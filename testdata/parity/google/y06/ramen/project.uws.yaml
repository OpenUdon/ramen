info:
  description: Google Cloud Storage managed folder static parity fixture for Y06.
  title: ramen_google_y06_storage_managed_folder_parity
  version: 1.0.0
x-udon-config:
  provider:
    name: google
    serverUrl: https://storage.googleapis.com/storage/v1
  security:
    - binding: google_oauth2
      name: google_oauth2
      scheme:
        flows:
          authorizationCode:
            scopes:
              https://www.googleapis.com/auth/devstorage.full_control: Manage Google Cloud Storage data.
        type: oauth2
operations:
  - description: Create the Google Cloud Storage managed folder.
    operationId: google_storage_managed_folder_folder_create
    request:
      path:
        bucket: ramen-parity-y06-static
      body:
        name: managed/y06/
      x-ramen-credential-bindings:
        - google_oauth2
    sourceDescription: storage
    sourceOperationId: storage.managedFolders.insert
  - description: Read the Google Cloud Storage managed folder.
    operationId: google_storage_managed_folder_folder_read
    request:
      path:
        bucket: ramen-parity-y06-static
        managedFolder: managed/y06/
      x-ramen-credential-bindings:
        - google_oauth2
    sourceDescription: storage
    sourceOperationId: storage.managedFolders.get
  - description: Delete the Google Cloud Storage managed folder.
    operationId: google_storage_managed_folder_folder_delete
    request:
      path:
        bucket: ramen-parity-y06-static
        managedFolder: managed/y06/
      x-ramen-credential-bindings:
        - google_oauth2
    sourceDescription: storage
    sourceOperationId: storage.managedFolders.delete
sourceDescriptions:
  - name: storage
    type: google-discovery
    url: ../../../../api-sources/google-cloud-storage-discovery-v1.json
uws: 1.4.0
workflows:
