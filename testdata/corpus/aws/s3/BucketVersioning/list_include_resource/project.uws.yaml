info:
    description: Native UWS/Ramen desired-state project generated from static Terraform/OpenTofu configuration.
    title: ramen_native_project
    version: 1.0.0
operations:
    - description: Review create create for Terraform resource aws_s3_bucket.test
      operationId: aws_s3_bucket_test_create
      request:
        path:
            Bucket: '"${var.rName}-${count.index}"'
        x-ramen-credential-bindings:
            - aws_hmac
        x-ramen-terraform:
            attributes:
                bucket: '"${var.rName}-${count.index}"'
            object:
                address: aws_s3_bucket.test
                kind: resource
                name: test
                type: aws_s3_bucket
      sourceDescription: s3
      sourceOperationId: CreateBucket
    - description: Review create create for Terraform resource aws_s3_bucket_versioning.test
      operationId: aws_s3_bucket_versioning_test_create
      request:
        body:
            VersioningConfiguration:
                Status: '"Enabled"'
        path:
            Bucket: aws_s3_bucket.test[count.index].bucket
        x-ramen-credential-bindings:
            - aws_hmac
        x-ramen-terraform:
            attributes:
                bucket: aws_s3_bucket.test[count.index].bucket
                versioning_configuration:
                    status: '"Enabled"'
            identity_attributes:
                - name: bucket
                  request_keys:
                    - Bucket
                  required: true
                  terraform_path: bucket
            object:
                address: aws_s3_bucket_versioning.test
                kind: resource
                name: test
                type: aws_s3_bucket_versioning
      sourceDescription: s3
      sourceOperationId: PutBucketVersioning
sourceDescriptions:
    - name: s3
      type: aws-smithy
      url: aws-smithy/s3.json
uws: 1.4.0
workflows:
    - description: Review mapped Terraform/OpenTofu objects as API source operations.
      steps:
        - body:
            action: create
            purpose: create
            terraform_address: aws_s3_bucket.test
            terraform_type: aws_s3_bucket
          operationRef: aws_s3_bucket_test_create
          stepId: aws_s3_bucket_test_create
        - body:
            action: create
            purpose: create
            terraform_address: aws_s3_bucket_versioning.test
            terraform_type: aws_s3_bucket_versioning
          operationRef: aws_s3_bucket_versioning_test_create
          stepId: aws_s3_bucket_versioning_test_create
      type: sequence
      workflowId: main
x-ramen-desired-state:
    api_sources:
        - id: s3
          kind: aws-smithy
          path: aws-smithy/s3.json
    metadata:
        action: create
        config_dir: testdata/corpus/aws/s3/BucketVersioning/list_include_resource/input
        source: ramen convert tf
    redaction: {}
    resources:
        - address: aws_s3_bucket.test
          attributes:
            bucket: '"${var.rName}-${count.index}"'
          credential_bindings:
            - aws_hmac
          kind: resource
          lifecycle: {}
          metadata:
            terraform_address: aws_s3_bucket.test
          name: test
          operations:
            create:
                credential_bindings:
                    - aws_hmac
                operation_id: CreateBucket
                purpose: create
                source_id: s3
                source_kind: aws-smithy
                source_path: aws-smithy/s3.json
          redaction: {}
          type: aws_s3_bucket
        - address: aws_s3_bucket_versioning.test
          attributes:
            bucket: aws_s3_bucket.test[count.index].bucket
            versioning_configuration:
                status: '"Enabled"'
          credential_bindings:
            - aws_hmac
          dependencies:
            - aws_s3_bucket.test
          identity_attributes:
            - name: bucket
              path: bucket
              request_keys:
                - Bucket
              required: true
          kind: resource
          lifecycle: {}
          metadata:
            terraform_address: aws_s3_bucket_versioning.test
          name: test
          operations:
            create:
                credential_bindings:
                    - aws_hmac
                operation_id: PutBucketVersioning
                purpose: create
                source_id: s3
                source_kind: aws-smithy
                source_path: aws-smithy/s3.json
          redaction: {}
          type: aws_s3_bucket_versioning
    version: ramen.project.v1
