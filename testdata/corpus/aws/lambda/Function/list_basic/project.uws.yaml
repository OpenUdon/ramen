info:
    description: Native UWS/Ramen desired-state project generated from static Terraform/OpenTofu configuration.
    title: ramen_native_project
    version: 1.0.0
operations:
    - description: Review create create for Terraform resource aws_iam_role.test
      operationId: aws_iam_role_test_create
      request:
        body:
            AssumeRolePolicyDocument: '"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Action\": \"sts:AssumeRole\",\n      \"Principal\": {\n        \"Service\": \"lambda.amazonaws.com\"\n      },\n      \"Effect\": \"Allow\",\n      \"Sid\": \"\"\n    }\n  ]\n}\n"'
            RoleName: var.rName
        x-ramen-credential-bindings:
            - aws_hmac
        x-ramen-terraform:
            attributes:
                assume_role_policy: '"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Action\": \"sts:AssumeRole\",\n      \"Principal\": {\n        \"Service\": \"lambda.amazonaws.com\"\n      },\n      \"Effect\": \"Allow\",\n      \"Sid\": \"\"\n    }\n  ]\n}\n"'
                name: var.rName
            identity_attributes:
                - name: role_name
                  request_keys:
                    - RoleName
                  required: true
                  response_paths:
                    - Role.Arn
                    - Role.RoleName
                  terraform_path: name
            object:
                address: aws_iam_role.test
                kind: resource
                name: test
                type: aws_iam_role
            version: ramen.terraform.provenance.v1
      sourceDescription: iam
      sourceOperationId: CreateRole
    - description: Review create create for Terraform resource aws_iam_role_policy.test
      operationId: aws_iam_role_policy_test_create
      request:
        body:
            PolicyDocument: |-
                <<EOF
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": [
                        "logs:CreateLogGroup",
                        "logs:CreateLogStream",
                        "logs:PutLogEvents"
                      ],
                      "Resource": "arn:${data.aws_partition.current.partition}:logs:*:*:*"
                    }
                  ]
                }
                EOF
            PolicyName: var.rName
            RoleName: aws_iam_role.test.id
        x-ramen-credential-bindings:
            - aws_hmac
        x-ramen-terraform:
            attributes:
                name: var.rName
                policy: |-
                    <<EOF
                    {
                      "Version": "2012-10-17",
                      "Statement": [
                        {
                          "Effect": "Allow",
                          "Action": [
                            "logs:CreateLogGroup",
                            "logs:CreateLogStream",
                            "logs:PutLogEvents"
                          ],
                          "Resource": "arn:${data.aws_partition.current.partition}:logs:*:*:*"
                        }
                      ]
                    }
                    EOF
                role: aws_iam_role.test.id
            object:
                address: aws_iam_role_policy.test
                kind: resource
                name: test
                type: aws_iam_role_policy
            version: ramen.terraform.provenance.v1
      sourceDescription: iam
      sourceOperationId: PutRolePolicy
    - description: Review create create for Terraform resource aws_lambda_function.test
      operationId: aws_lambda_function_test_create
      request:
        body:
            FunctionName: '"${var.rName}-${count.index}"'
            Handler: '"exports.example"'
            Role: aws_iam_role.test.arn
            Runtime: '"nodejs24.x"'
        x-ramen-credential-bindings:
            - aws_hmac
        x-ramen-terraform:
            attributes:
                filename: '"test-fixtures/lambdatest.zip"'
                function_name: '"${var.rName}-${count.index}"'
                handler: '"exports.example"'
                role: aws_iam_role.test.arn
                runtime: '"nodejs24.x"'
            object:
                address: aws_lambda_function.test
                kind: resource
                name: test
                type: aws_lambda_function
            version: ramen.terraform.provenance.v1
      sourceDescription: lambda
      sourceOperationId: CreateFunction
sourceDescriptions:
    - name: iam
      type: aws-smithy
      url: aws-smithy/iam.json
    - name: lambda
      type: aws-smithy
      url: aws-smithy/lambda.json
uws: 1.4.0
workflows:
    - description: Review mapped Terraform/OpenTofu objects as API source operations.
      steps:
        - body:
            action: create
            purpose: create
            terraform_address: aws_iam_role.test
            terraform_type: aws_iam_role
          operationRef: aws_iam_role_test_create
          stepId: aws_iam_role_test_create
        - body:
            action: create
            purpose: create
            terraform_address: aws_iam_role_policy.test
            terraform_type: aws_iam_role_policy
          operationRef: aws_iam_role_policy_test_create
          stepId: aws_iam_role_policy_test_create
        - body:
            action: create
            purpose: create
            terraform_address: aws_lambda_function.test
            terraform_type: aws_lambda_function
          operationRef: aws_lambda_function_test_create
          stepId: aws_lambda_function_test_create
      type: sequence
      workflowId: main
x-ramen-desired-state:
    api_sources:
        - id: iam
          kind: aws-smithy
          path: aws-smithy/iam.json
        - id: lambda
          kind: aws-smithy
          path: aws-smithy/lambda.json
    metadata:
        action: create
        config_dir: testdata/corpus/aws/lambda/Function/list_basic/input
        source: ramen convert tf
    redaction: {}
    resources:
        - address: aws_iam_role.test
          attributes:
            assume_role_policy: '"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Action\": \"sts:AssumeRole\",\n      \"Principal\": {\n        \"Service\": \"lambda.amazonaws.com\"\n      },\n      \"Effect\": \"Allow\",\n      \"Sid\": \"\"\n    }\n  ]\n}\n"'
            name: var.rName
          credential_bindings:
            - aws_hmac
          identity_attributes:
            - name: role_name
              path: name
              request_keys:
                - RoleName
              required: true
              response_paths:
                - Role.RoleName
                - Role.Arn
          kind: resource
          lifecycle: {}
          metadata:
            terraform_address: aws_iam_role.test
          name: test
          operations:
            create:
                credential_bindings:
                    - aws_hmac
                operation_id: CreateRole
                purpose: create
                source_id: iam
                source_kind: aws-smithy
                source_path: aws-smithy/iam.json
          redaction: {}
          type: aws_iam_role
        - address: aws_iam_role_policy.test
          attributes:
            name: var.rName
            policy: |-
                <<EOF
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": [
                        "logs:CreateLogGroup",
                        "logs:CreateLogStream",
                        "logs:PutLogEvents"
                      ],
                      "Resource": "arn:${data.aws_partition.current.partition}:logs:*:*:*"
                    }
                  ]
                }
                EOF
            role: aws_iam_role.test.id
          credential_bindings:
            - aws_hmac
          dependencies:
            - aws_iam_role.test
            - data.aws_partition.current
          kind: resource
          lifecycle: {}
          metadata:
            terraform_address: aws_iam_role_policy.test
          name: test
          operations:
            create:
                credential_bindings:
                    - aws_hmac
                operation_id: PutRolePolicy
                purpose: create
                source_id: iam
                source_kind: aws-smithy
                source_path: aws-smithy/iam.json
          redaction: {}
          type: aws_iam_role_policy
        - address: aws_lambda_function.test
          attributes:
            filename: '"test-fixtures/lambdatest.zip"'
            function_name: '"${var.rName}-${count.index}"'
            handler: '"exports.example"'
            role: aws_iam_role.test.arn
            runtime: '"nodejs24.x"'
          credential_bindings:
            - aws_hmac
          dependencies:
            - aws_iam_role.test
          kind: resource
          lifecycle: {}
          metadata:
            terraform_address: aws_lambda_function.test
          name: test
          operations:
            create:
                credential_bindings:
                    - aws_hmac
                operation_id: CreateFunction
                purpose: create
                source_id: lambda
                source_kind: aws-smithy
                source_path: aws-smithy/lambda.json
          redaction: {}
          type: aws_lambda_function
    version: ramen.project.v1
