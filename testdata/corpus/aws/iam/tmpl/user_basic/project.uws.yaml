                - User.UserId
          kind: resource
          lifecycle: {}
          metadata:
            terraform_address: aws_iam_user.test
          name: test
          operations:
            create:
                credential_bindings:
                    - aws_hmac
                operation_id: CreateUser
                purpose: create
                source_id: iam
                source_kind: aws-smithy
                source_path: aws-smithy/iam.json
          redaction: {}
          type: aws_iam_user
    version: ramen.project.v1
