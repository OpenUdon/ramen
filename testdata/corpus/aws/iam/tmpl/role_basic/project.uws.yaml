info:
    description: Native UWS/Ramen desired-state project generated from static Terraform/OpenTofu configuration.
    title: ramen_native_project
    version: 1.0.0
operations:
    - description: Review create create for Terraform resource aws_iam_role.test
      operationId: aws_iam_role_test_create
      request:
        body:
            AssumeRolePolicyDocument: |-
                jsonencode({
                    Version = "2012-10-17"
                    Statement = [{
                      Action = "sts:AssumeRole",
                      Principal = {
                        Service = "ec2.${data.aws_partition.current.dns_suffix}",
                      }
                      Effect = "Allow"
                      Sid    = ""
                    }]
                  })
            RoleName: var.rName
        x-ramen-credential-bindings:
            - aws_hmac
        x-ramen-terraform:
            attributes:
                assume_role_policy: |-
                    jsonencode({
                        Version = "2012-10-17"
                        Statement = [{
                          Action = "sts:AssumeRole",
                          Principal = {
                            Service = "ec2.${data.aws_partition.current.dns_suffix}",
                          }
                          Effect = "Allow"
                          Sid    = ""
                        }]
                      })
                name: var.rName
            identity_attributes:
                - name: role_name
                  request_keys:
                    - RoleName
                  required: true
                  response_paths:
                    - Role.Arn
                    - Role.RoleName
                  terraform_path: name
            object:
                address: aws_iam_role.test
                kind: resource
                name: test
                type: aws_iam_role
            version: ramen.terraform.provenance.v1
      sourceDescription: iam
      sourceOperationId: CreateRole
sourceDescriptions:
    - name: iam
      type: aws-smithy
      url: aws-smithy/iam.json
uws: 1.4.0
workflows:
    - description: Review mapped Terraform/OpenTofu objects as API source operations.
      steps:
        - body:
            action: create
            purpose: create
            terraform_address: aws_iam_role.test
            terraform_type: aws_iam_role
          operationRef: aws_iam_role_test_create
          stepId: aws_iam_role_test_create
      type: sequence
      workflowId: main
x-ramen-desired-state:
    api_sources:
        - id: iam
          kind: aws-smithy
          path: aws-smithy/iam.json
    metadata:
        action: create
        config_dir: testdata/corpus/aws/iam/tmpl/role_basic/input
        source: ramen convert tf
    redaction: {}
    resources:
        - address: aws_iam_role.test
          attributes:
            assume_role_policy: |-
                jsonencode({
                    Version = "2012-10-17"
                    Statement = [{
                      Action = "sts:AssumeRole",
                      Principal = {
                        Service = "ec2.${data.aws_partition.current.dns_suffix}",
                      }
                      Effect = "Allow"
                      Sid    = ""
                    }]
                  })
            name: var.rName
          credential_bindings:
            - aws_hmac
          dependencies:
            - data.aws_partition.current
          identity_attributes:
            - name: role_name
              path: name
              request_keys:
                - RoleName
              required: true
              response_paths:
                - Role.RoleName
                - Role.Arn
          kind: resource
          lifecycle: {}
          metadata:
            terraform_address: aws_iam_role.test
          name: test
          operations:
            create:
                credential_bindings:
                    - aws_hmac
                operation_id: CreateRole
                purpose: create
                source_id: iam
                source_kind: aws-smithy
                source_path: aws-smithy/iam.json
          redaction: {}
          type: aws_iam_role
    version: ramen.project.v1
