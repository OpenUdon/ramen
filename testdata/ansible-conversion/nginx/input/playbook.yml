- name: Configure nginx
  hosts: webservers
  vars:
    pkg: nginx
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: "{{ pkg }}"
        state: present

    - name: Deploy nginx config
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: restart nginx

  handlers:
    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
