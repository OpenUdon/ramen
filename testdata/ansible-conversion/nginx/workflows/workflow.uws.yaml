components:
    variables:
        pkg: nginx
info:
    title: Configure nginx
    version: 1.0.0
operations:
    - description: Install nginx
      operationId: install_nginx
      outputs:
        changed: $response.body.changed
      request:
        body:
            name: $variables.pkg
            state: present
      sourceDescription: builtin
      sourceOperationId: ansible.builtin.apt
      successCriteria:
        - condition: $response.body.failed != true
      x-ansible:
        column: 7
        line: 6
        play: Configure nginx
        section: tasks
        sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
        task: Install nginx
        version: ramen.ansible.provenance.v1
    - description: Deploy nginx config
      operationId: deploy_nginx_config
      outputs:
        changed: $response.body.changed
      request:
        body:
            dest: /etc/nginx/nginx.conf
            src: nginx.conf.j2
      sourceDescription: builtin
      sourceOperationId: ansible.builtin.template
      successCriteria:
        - condition: $response.body.failed != true
      x-ansible:
        column: 7
        line: 11
        play: Configure nginx
        section: tasks
        sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
        task: Deploy nginx config
        version: ramen.ansible.provenance.v1
    - description: restart nginx
      operationId: restart_nginx
      outputs:
        changed: $response.body.changed
      request:
        body:
            name: nginx
            state: restarted
      sourceDescription: builtin
      sourceOperationId: ansible.builtin.service
      successCriteria:
        - condition: $response.body.failed != true
      x-ansible:
        column: 7
        line: 18
        play: Configure nginx
        section: handlers
        sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
        task: restart nginx
        version: ramen.ansible.provenance.v1
sourceDescriptions:
    - name: builtin
      type: ansible-module
      url: testdata/argspec/ansible-builtin.argspec.json
uws: 1.6.0
workflows:
    - steps:
        - operationRef: install_nginx
          stepId: install_nginx
          x-ansible:
            column: 7
            line: 6
            play: Configure nginx
            section: tasks
            sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
            task: Install nginx
            version: ramen.ansible.provenance.v1
        - operationRef: deploy_nginx_config
          stepId: deploy_nginx_config
          x-ansible:
            column: 7
            line: 11
            play: Configure nginx
            section: tasks
            sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
            task: Deploy nginx config
            version: ramen.ansible.provenance.v1
        - operationRef: restart_nginx
          stepId: restart_nginx
          when: $steps.deploy_nginx_config.outputs.changed == true
          x-ansible:
            column: 7
            line: 18
            play: Configure nginx
            section: handlers
            sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
            task: restart nginx
            version: ramen.ansible.provenance.v1
      type: sequence
      workflowId: main
