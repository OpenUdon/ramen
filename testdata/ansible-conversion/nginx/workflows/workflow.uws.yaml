components:
    variables:
        pkg: nginx
info:
    title: Configure nginx
    version: 1.0.0
operations:
    - description: Install nginx
      operationId: install_nginx
      outputs:
        changed: $response.body.changed
      request:
        body:
            name: $variables.pkg
            state: present
      successCriteria:
        - condition: $response.body.failed != true
      x-ramen-ansible-module:
        argspec:
            collection: ansible.builtin
            sourceId: builtin
            url: testdata/argspec/ansible-builtin.argspec.json
        module: ansible.builtin.apt
      x-ramen-ansible-provenance:
        column: 7
        line: 6
        play: Configure nginx
        section: tasks
        sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
        task: Install nginx
        version: ramen.ansible.provenance.v1
      x-uws-operation-profile: ramen.ansible-module-call.1.0
    - description: Deploy nginx config
      operationId: deploy_nginx_config
      outputs:
        changed: $response.body.changed
      request:
        body:
            dest: /etc/nginx/nginx.conf
            src: nginx.conf.j2
      successCriteria:
        - condition: $response.body.failed != true
      x-ramen-ansible-module:
        argspec:
            collection: ansible.builtin
            sourceId: builtin
            url: testdata/argspec/ansible-builtin.argspec.json
        module: ansible.builtin.template
      x-ramen-ansible-provenance:
        column: 7
        line: 11
        play: Configure nginx
        section: tasks
        sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
        task: Deploy nginx config
        version: ramen.ansible.provenance.v1
      x-uws-operation-profile: ramen.ansible-module-call.1.0
    - description: restart nginx
      operationId: restart_nginx
      outputs:
        changed: $response.body.changed
      request:
        body:
            name: nginx
            state: restarted
      successCriteria:
        - condition: $response.body.failed != true
      x-ramen-ansible-module:
        argspec:
            collection: ansible.builtin
            sourceId: builtin
            url: testdata/argspec/ansible-builtin.argspec.json
        module: ansible.builtin.service
      x-ramen-ansible-provenance:
        column: 7
        line: 18
        play: Configure nginx
        section: handlers
        sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
        task: restart nginx
        version: ramen.ansible.provenance.v1
      x-uws-operation-profile: ramen.ansible-module-call.1.0
uws: 1.5.0
workflows:
    - steps:
        - operationRef: install_nginx
          stepId: install_nginx
          x-ramen-ansible-provenance:
            column: 7
            line: 6
            play: Configure nginx
            section: tasks
            sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
            task: Install nginx
            version: ramen.ansible.provenance.v1
        - operationRef: deploy_nginx_config
          stepId: deploy_nginx_config
          x-ramen-ansible-provenance:
            column: 7
            line: 11
            play: Configure nginx
            section: tasks
            sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
            task: Deploy nginx config
            version: ramen.ansible.provenance.v1
        - operationRef: restart_nginx
          stepId: restart_nginx
          when: $steps.deploy_nginx_config.outputs.changed == true
          x-ramen-ansible-provenance:
            column: 7
            line: 18
            play: Configure nginx
            section: handlers
            sourceFile: ../../testdata/ansible-conversion/nginx/input/playbook.yml
            task: restart nginx
            version: ramen.ansible.provenance.v1
      type: sequence
      workflowId: main
