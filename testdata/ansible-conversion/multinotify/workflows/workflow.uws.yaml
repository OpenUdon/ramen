info:
    title: Configure nginx with multiple notifiers
    version: 1.0.0
operations:
    - description: Install nginx
      operationId: install_nginx
      outputs:
        changed: $response.body.changed
      request:
        body:
            name: nginx
            state: present
      sourceDescription: builtin
      sourceOperationId: ansible.builtin.apt
      successCriteria:
        - condition: $response.body.failed != true
      x-ansible:
        column: 7
        line: 4
        play: Configure nginx with multiple notifiers
        section: tasks
        sourceFile: ../../testdata/ansible-conversion/multinotify/input/playbook.yml
        task: Install nginx
        version: ramen.ansible.provenance.v1
    - description: Deploy nginx config
      operationId: deploy_nginx_config
      outputs:
        changed: $response.body.changed
      request:
        body:
            dest: /etc/nginx/nginx.conf
            src: nginx.conf.j2
      sourceDescription: builtin
      sourceOperationId: ansible.builtin.template
      successCriteria:
        - condition: $response.body.failed != true
      x-ansible:
        column: 7
        line: 10
        play: Configure nginx with multiple notifiers
        section: tasks
        sourceFile: ../../testdata/ansible-conversion/multinotify/input/playbook.yml
        task: Deploy nginx config
        version: ramen.ansible.provenance.v1
    - description: restart nginx
      operationId: restart_nginx
      outputs:
        changed: $response.body.changed
      request:
        body:
            name: nginx
            state: restarted
      sourceDescription: builtin
      sourceOperationId: ansible.builtin.service
      successCriteria:
        - condition: $response.body.failed != true
      x-ansible:
        column: 7
        line: 17
        play: Configure nginx with multiple notifiers
        section: handlers
        sourceFile: ../../testdata/ansible-conversion/multinotify/input/playbook.yml
        task: restart nginx
        version: ramen.ansible.provenance.v1
sourceDescriptions:
    - name: builtin
      type: ansible-module
      url: testdata/argspec/ansible-builtin.argspec.json
uws: 1.6.0
workflows:
    - steps:
        - operationRef: install_nginx
          stepId: install_nginx
          x-ansible:
            column: 7
            line: 4
            play: Configure nginx with multiple notifiers
            section: tasks
            sourceFile: ../../testdata/ansible-conversion/multinotify/input/playbook.yml
            task: Install nginx
            version: ramen.ansible.provenance.v1
        - operationRef: deploy_nginx_config
          stepId: deploy_nginx_config
          x-ansible:
            column: 7
            line: 10
            play: Configure nginx with multiple notifiers
            section: tasks
            sourceFile: ../../testdata/ansible-conversion/multinotify/input/playbook.yml
            task: Deploy nginx config
            version: ramen.ansible.provenance.v1
        - cases:
            - name: notified_by_install_nginx
              steps:
                - operationRef: restart_nginx
                  stepId: restart_nginx_run_1
                  x-ansible:
                    column: 7
                    line: 17
                    play: Configure nginx with multiple notifiers
                    section: handlers
                    sourceFile: ../../testdata/ansible-conversion/multinotify/input/playbook.yml
                    task: restart nginx
                    version: ramen.ansible.provenance.v1
              when: $steps.install_nginx.outputs.changed == true
            - name: notified_by_deploy_nginx_config
              steps:
                - operationRef: restart_nginx
                  stepId: restart_nginx_run_2
                  x-ansible:
                    column: 7
                    line: 17
                    play: Configure nginx with multiple notifiers
                    section: handlers
                    sourceFile: ../../testdata/ansible-conversion/multinotify/input/playbook.yml
                    task: restart nginx
                    version: ramen.ansible.provenance.v1
              when: $steps.deploy_nginx_config.outputs.changed == true
          stepId: restart_nginx_notify
          type: switch
          x-ansible:
            column: 7
            line: 17
            play: Configure nginx with multiple notifiers
            section: handlers
            sourceFile: ../../testdata/ansible-conversion/multinotify/input/playbook.yml
            task: restart nginx
            version: ramen.ansible.provenance.v1
      type: sequence
      workflowId: main
