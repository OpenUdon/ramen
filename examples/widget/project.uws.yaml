uws: 1.4.0
info:
  title: Ramen local widget example
  version: 1.0.0
sourceDescriptions:
  - name: widget-api
    type: openapi
    url: api.openapi.yaml
operations:
  - operationId: put_widget
    description: Create or update the desired widget.
    sourceDescription: widget-api
    sourceOperationId: putWidget
  - operationId: read_widget
    description: Read the desired widget.
    sourceDescription: widget-api
    sourceOperationId: getWidget
  - operationId: delete_widget
    description: Delete the desired widget.
    sourceDescription: widget-api
    sourceOperationId: deleteWidget
workflows:
  - workflowId: review
    type: sequence
    description: Review the widget lifecycle operations.
    steps:
      - stepId: put
        operationRef: put_widget
      - stepId: read
        operationRef: read_widget
      - stepId: delete
        operationRef: delete_widget
